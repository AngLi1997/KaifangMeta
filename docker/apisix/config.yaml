# 本地开发：单节点 traditional 模式；生产按 docs/gateway.md 拆控制面 / 数据面
apisix:
  # km-* 自研插件随镜像发布，本地开发挂载 docker/apisix/plugins
  extra_lua_path: "/opt/km/?.lua"

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    enable_admin_ui: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    allow_admin:
      - 0.0.0.0/0
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix

# 显式列出启用的插件（会覆盖默认列表）
plugins:
  - real-ip
  - request-id
  - cors
  - openid-connect
  - km-identity
  - proxy-rewrite
  - limit-count
  - api-breaker
  - traffic-split
