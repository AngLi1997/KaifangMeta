# 从仓库根目录运行：docker compose --project-directory . -f docker/docker-compose.yml up -d
# 本地基础设施：PostgreSQL + pgvector、Redis、MinIO、APISIX + etcd；配置来自根目录 .env
name: kaifang-meta-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kaifang-meta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kaifang-meta-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: kaifang-meta-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-console:
    image: nginx:1.27-alpine
    container_name: kaifang-meta-minio-console
    restart: unless-stopped
    depends_on:
      - minio
    volumes:
      - ./docker/minio-console.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MINIO_CONSOLE_PORT}:9001"

  ops-console-https:
    image: nginx:1.27-alpine
    container_name: kaifang-meta-ops-console-https
    restart: unless-stopped
    profiles: ["ops-https"]
    depends_on:
      - minio
      - apisix
    volumes:
      - ./docker/ops-console-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs/kaifang-meta.crt:/etc/nginx/certs/tls.crt:ro
      - ./.certs/kaifang-meta.key:/etc/nginx/certs/tls.key:ro
    ports:
      - "${VITE_MINIO_CONSOLE_HTTPS_PORT:-9444}:9444"
      - "${VITE_APISIX_DASHBOARD_HTTPS_PORT:-9181}:9181"
      - "${MINIO_API_HTTPS_PORT:-9445}:9445"

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: kaifang-meta-etcd
    restart: unless-stopped
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "127.0.0.1:${ETCD_PORT}:2379"
    volumes:
      - etcd-data:/etcd-data

  etcd-workbench:
    image: tzfun/etcd-workbench:1.1.4
    container_name: kaifang-meta-etcd-workbench
    restart: unless-stopped
    depends_on:
      - etcd
    ports:
      - "127.0.0.1:${ETCD_WORKBENCH_PORT:-9010}:8002"
    volumes:
      - etcd-workbench-data:/usr/tzfun/etcd-workbench/data

  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: kaifang-meta-apisix
    restart: unless-stopped
    depends_on:
      - etcd
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY}
    volumes:
      - ./docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./docker/apisix/plugins:/opt/km:ro
    ports:
      - "${APISIX_HTTP_PORT}:9080"
      - "${APISIX_HTTPS_PORT}:9443"
      - "127.0.0.1:${APISIX_ADMIN_PORT}:9180"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  etcd-data:
  etcd-workbench-data:
