server {
        listen 80;
        server_name localhost;
        location / {
              root /opt/kaifang-meta-platform/web/dist;
              index index.html index.htm;
              try_files $uri /index.html;
        }
        # 认证与控制台 API 一律经网关（模式 A），不直连平台进程；GATEWAY_UPSTREAM 由 entrypoint 替换
        location ^~ /kaifang-meta/ {
                proxy_pass http://GATEWAY_UPSTREAM;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        # 预签名文件地址只含路径，同源转发到 MinIO；Host 须为签名时的 MinIO 地址，占位符由 entrypoint 替换
        location ^~ /MINIO_BUCKET/ {
                proxy_pass MINIO_SCHEME://MINIO_ENDPOINT;
                proxy_set_header Host MINIO_ENDPOINT;
                client_max_body_size 0;
        }
}
