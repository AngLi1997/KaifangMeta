<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}</style>
<title>中台原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* layout: 应用壳 = 顶栏 + 侧栏 + 内容区；平台与业务系统共用同一前端壳，仅主色不同 */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --sunk: #f7f8fa;
  --line: #dde2e8;
  --fg: #19212b;
  --muted: #6b7684;
  --faint: #9aa3af;
  --accent: #2b61a3;
  --accent-soft: #e6eef8;
  --ar-accent: #2f7a63;
  --ar-soft: #e4f1ec;
  --ok: #2f8a57; --ok-soft: #e5f3ea;
  --warn: #a8680b; --warn-soft: #fbf0dc;
  --err: #b8403a; --err-soft: #f9e5e3;
  --paper: #fbfaf6; --ink: #3a3f47;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1317; --panel: #161b21; --sunk: #12171c; --line: #29313b; --fg: #e3e8ee;
    --muted: #8d97a5; --faint: #5f6875; --accent: #73a7e3; --accent-soft: #1b2838;
    --ar-accent: #5fbf9b; --ar-soft: #15291f;
    --ok: #5cc287; --ok-soft: #142a1d; --warn: #e0a64a; --warn-soft: #2d2311; --err: #ec7a72; --err-soft: #2f1716;
    --paper: #d9d6cc; --ink: #2c3036;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1317; --panel: #161b21; --sunk: #12171c; --line: #29313b; --fg: #e3e8ee;
  --muted: #8d97a5; --faint: #5f6875; --accent: #73a7e3; --accent-soft: #1b2838;
  --ar-accent: #5fbf9b; --ar-soft: #15291f;
  --ok: #5cc287; --ok-soft: #142a1d; --warn: #e0a64a; --warn-soft: #2d2311; --err: #ec7a72; --err-soft: #2f1716;
  --paper: #d9d6cc; --ink: #2c3036;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.frame { height: 100%; overflow: auto; }
.archive { --accent: var(--ar-accent); --accent-soft: var(--ar-soft); }

/* shell */
.shell { min-width: 1180px; height: 100%; display: grid; grid-template-columns: 212px 1fr; grid-template-rows: 48px 1fr; }
.shell.wb { grid-template-columns: 1fr; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; width: 180px; }
.mark { width: 24px; height: 24px; border-radius: 4px; background: var(--accent); color: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 500; }
.crumb { color: var(--muted); display: flex; gap: 6px; }
.crumb b { color: var(--fg); font-weight: 500; }
.top .sp { flex: 1; }
.top .ic { color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 4px; }
.top .ic:hover { background: var(--sunk); color: var(--fg); }
.ava { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 500; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.grp { display: flex; flex-direction: column; gap: 1px; }
.grp > span { font-size: 11px; color: var(--faint); letter-spacing: .08em; padding: 4px 10px; }
.nav { padding: 7px 10px; border-radius: 4px; color: var(--muted); display: flex; justify-content: space-between; }
.nav:hover { background: var(--sunk); color: var(--fg); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--faint); }
.nav.sub { padding-left: 24px; font-size: 12px; }
.main { overflow: auto; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.main > * { flex-shrink: 0; }

/* page parts */
.ph { display: flex; align-items: center; gap: 12px; }
.ph h1 { font-size: 16px; font-weight: 600; margin: 0; }
.ph .sub { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.ph .sp { flex: 1; }
.btn { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card > .ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 500; }
.card > .cb { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; min-width: 0; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inp, select.inp, textarea.inp { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); min-width: 0; }
textarea.inp { resize: vertical; line-height: 1.6; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg a { cursor: pointer; padding: 5px 12px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }
.seg a:last-child { border-right: 0; }
.seg a.on { background: var(--accent-soft); color: var(--accent); }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--fg); border-color: var(--accent); font-weight: 500; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 9px 16px; background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td a.lk { color: var(--accent); }
.m { font-family: var(--mono); font-size: 12px; }
.mu { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.err { background: var(--err-soft); color: var(--err); }
.tag.ac { background: var(--accent-soft); color: var(--accent); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
.prog { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; width: 120px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; align-items: baseline; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
pre.code { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; overflow-x: auto; color: var(--fg); }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; }
.stat b { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.tree { display: flex; flex-direction: column; gap: 2px; }
.tree a { padding: 5px 8px; border-radius: 4px; color: var(--muted); }
.tree a.on { background: var(--accent-soft); color: var(--accent); }
.tree .l2 { padding-left: 24px; }
.tree .l3 { padding-left: 40px; }
.note { font-size: 12px; color: var(--muted); }

/* capability cards */
.caps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cap { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.cap:hover { border-color: var(--accent); }
.cap .t { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
.cap .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* versions */
.vl { display: flex; flex-direction: column; }
.vi { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.vi:last-child { border-bottom: 0; }
.vi .v { font-family: var(--mono); font-weight: 500; }
.vi .d { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }

/* document mock */
.doc { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; position: relative; aspect-ratio: 210 / 297; max-width: 100%; padding: 9% 10%; display: flex; flex-direction: column; gap: 3.2%; overflow: hidden; }
.doc .hdr { text-align: center; color: #b3312a; font-size: 20px; font-weight: 600; letter-spacing: .3em; }
.doc .no { text-align: center; font-size: 11px; }
.doc .rule { height: 2px; background: #b3312a; }
.doc .tt { text-align: center; font-weight: 600; font-size: 13px; }
.doc .ln { height: 7px; background: #c9c6bd; border-radius: 2px; }
.doc .seal { position: absolute; right: 14%; bottom: 13%; width: 22%; aspect-ratio: 1; border: 2px solid #c8413a; border-radius: 50%; opacity: .75; }
.box { position: absolute; border: 1.5px solid var(--b); background: color-mix(in srgb, var(--b) 10%, transparent); }
.box span { position: absolute; top: -18px; left: -1.5px; background: var(--b); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 2px; white-space: nowrap; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 72%; padding: 10px 14px; border-radius: 6px; line-height: 1.7; }
.msg.u { align-self: flex-end; background: var(--accent-soft); }
.msg.a { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.cite { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.step { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* login / portal */
.center { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.login { width: 380px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.login .inp { width: 100%; padding: 9px 12px; }
.login .btn { justify-content: center; padding: 9px; }
.portal { min-width: 1180px; min-height: 100%; display: grid; grid-template-rows: 48px 1fr; }
.pbody { max-width: 1080px; width: 100%; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.app { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
a.app:hover { border-color: var(--accent); }
.app .mark { width: 40px; height: 40px; font-size: 13px; border-radius: 6px; }
.app.off { opacity: .55; }
.app .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.chk input { accent-color: var(--accent); }
/* workflow */
.flow { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.flow a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-right: 1px solid var(--line); color: var(--muted); }
.flow a:last-child { border-right: 0; }
.flow a:hover { background: var(--sunk); }
.flow i { font-style: normal; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; }
.flow small { display: block; font-size: 11px; color: var(--faint); }
.flow a.done i { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.flow a.on { background: var(--accent-soft); color: var(--fg); font-weight: 500; }
.flow a.on i { background: var(--accent); color: var(--panel); border-color: transparent; }
.drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--sunk); text-align: center; }
del { color: var(--err); background: var(--err-soft); padding: 0 4px; border-radius: 2px; }
ins { color: var(--ok); background: var(--ok-soft); text-decoration: none; padding: 0 4px; border-radius: 2px; }
/* 工作台布局与插件（#label-form、#anno-layout） */
.main:has(> .wbx) { padding: 0; }
.wbx { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.wtop { display: flex; align-items: center; gap: 2px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.wtop .btn { border-color: transparent; background: transparent; }
.wtop .btn:hover { background: var(--sunk); }
.wtop .btn.on { color: var(--accent); background: var(--accent-soft); }
.wtop .vr { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
kbd { font-family: var(--mono); font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; opacity: .7; }
.warm { padding: 7px 16px; background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid var(--line); }
.wmid { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
.wside { flex: none; display: flex; flex-direction: column; min-height: 0; }
.wside.col { width: 36px; align-items: center; padding-top: 8px; gap: 6px; writing-mode: vertical-rl; letter-spacing: .2em; cursor: pointer; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.wpane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.wpane > .card { flex: none; }
.wbot { display: flex; align-items: center; gap: 18px; padding: 5px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.wbot .sp { flex: 1; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fld { display: flex; flex-direction: column; gap: 4px; padding: 6px; margin: -6px; border-radius: 4px; }
.fld.armed { background: var(--accent-soft); box-shadow: inset 2px 0 var(--accent); }
.fld > span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.fld > span b { color: var(--err); font-weight: 400; }
.fld .ocr { margin-left: auto; cursor: pointer; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 0 2px; }
.fld .ocr:hover, .fld.armed .ocr { color: var(--accent); }
.fld .inp.src { border-color: var(--ok); }
.cv { flex: 1; min-height: 360px; overflow: auto; background: var(--sunk); display: grid; place-items: center; padding: 24px; position: relative; }
.cv.armed { cursor: crosshair; }
.cv .doc { width: 420px; transition: transform .15s; user-select: none; }
.doc table.reg { font-size: 10px; border: 1px solid var(--ink); }
.doc table.reg td { padding: 5px 6px; border: 1px solid var(--ink); white-space: normal; color: var(--ink); }
.doc table.reg td:first-child { width: 28%; text-align: center; }
.doc [data-ocr].hit { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.sel { position: fixed; border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; z-index: 30; }
.iact { display: flex; gap: 2px; }
.iact button { font: inherit; border: 1px solid transparent; background: none; color: var(--muted); padding: 2px 8px; border-radius: 4px; cursor: pointer; }
.iact button:hover { background: var(--sunk); color: var(--fg); border-color: var(--line); }
td .inp { width: 100%; padding: 3px 6px; border-color: transparent; background: transparent; }
td .inp:hover, td .inp:focus { border-color: var(--line); background: var(--panel); }
td .inp.chg { color: var(--warn); }
.drawer { position: fixed; inset: 0 0 0 auto; width: 520px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgb(0 0 0 / .12); z-index: 40; display: flex; flex-direction: column; }
.drawer .ch { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 500; }
.drawer pre.code { flex: 1; margin: 12px 16px 16px; overflow: auto; }
/* 布局设计器 */
.lz { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.lz .row { display: flex; gap: 8px; min-height: 260px; }
.dz { border: 1.5px dashed var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 44px; background: var(--sunk); }
.dz.h { flex-direction: row; flex-wrap: wrap; align-items: center; }
.dz > small { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.dz.ok { border-color: var(--accent); background: var(--accent-soft); }
.dz.no { opacity: .45; }
.dz { min-width: 0; }
.pl { display: flex; align-items: center; gap: 6px; padding: 6px 10px; white-space: nowrap; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: grab; }
.pl.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pl .x { margin-left: auto; border: 0; background: none; color: var(--faint); cursor: pointer; }
.pl .m { color: var(--faint); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pl.cvb { flex-direction: column; align-items: stretch; overflow: visible; white-space: normal; }
.pl.cvb .dz { background: var(--panel); }
.pl.ins { box-shadow: -3px 0 0 var(--accent); }
.dz:not(.h) > .pl.ins { box-shadow: 0 -3px 0 var(--accent); }
.pv { position: fixed; z-index: 50; width: 240px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.pv .doc { margin: 0 auto; }
.pl.used { cursor: default; color: var(--faint); background: var(--sunk); }
.pal { display: flex; flex-wrap: wrap; gap: 6px; }
.pal .pl { padding: 4px 8px; }
.dz.h .pl { padding: 4px 8px; }
@media (prefers-reduced-motion: no-preference) { .main { animation: fade .16s ease-out; } }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }
</style>

<div class="frame" id="app"></div>

<script>
const T = (cols, rows) => `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const S = (t, k = '') => `<span class="tag ${k}">${t}</span>`;
const D = (t, k) => `<span class="tag ${k}"><i class="dot"></i>${t}</span>`;
const P = n => `<div class="bar"><div class="prog"><i style="width:${n}%"></i></div><span class="m mu">${n}%</span></div>`;
const card = (head, body, flush) => `<div class="card"><div class="ch">${head}</div>${flush ? body : `<div class="cb">${body}</div>`}</div>`;

// 能力目录：[名称, 标识, 类型, 可见性, 归属空间, 指标, 状态, 链接]
const CAP_TYPE = { operator: '算子', pipeline: '流水线', model: '模型', kb: '知识库', agent: 'Agent' };
const CAP_VIS = { public: ['公共', 'ok'], restricted: ['受限', 'warn'], private: ['私有', ''] };
const CAPS = [
  ['通用 OCR', 'ocr.general@2.3.0', 'operator', 'public', '', ['GPU · 实例 2/2', 'P95 410ms', '今日 18,240'], 'ok', '#op-ocr'],
  ['版面分析', 'layout@1.4.1', 'operator', 'public', '', ['GPU · 实例 2/2', 'P95 260ms', '今日 9,812'], 'ok'],
